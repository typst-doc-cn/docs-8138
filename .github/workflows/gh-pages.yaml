name: Deploy to GitHub Pages
on:
  push:
    branches:
      - locale
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docit:
    uses: ./.github/workflows/cache-docit.yml

  build:
    runs-on: ubuntu-latest
    needs: docit
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just, sd
      - name: Install pagefind
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/bin/
          curl -LO https://github.com/Pagefind/pagefind/releases/download/${PAGEFIND_VERSION}/pagefind_extended-${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          tar -xf pagefind_extended-${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          rm pagefind_extended-${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz
          chmod u+x pagefind_extended
          mv pagefind_extended ~/.local/bin/
          pagefind_extended --version
        env:
          PAGEFIND_VERSION: v1.5.2

      - run: just setup
      - name: Setup docit
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.docit.outputs.key }}
          path: target/typst-docs
          fail-on-cache-miss: true

      - run: just ci-build "/docs-8138/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/dist/

  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
