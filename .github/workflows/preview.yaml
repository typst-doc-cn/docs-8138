name: Preview a pull request
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  docit:
    uses: ./.github/workflows/cache-docit.yml

  build:
    runs-on: ubuntu-latest
    needs: docit
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install pagefind and pdfcpu
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/bin/

          curl -L https://github.com/Pagefind/pagefind/releases/download/${PAGEFIND_VERSION}/pagefind_extended-${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod u+x pagefind_extended
          mv pagefind_extended ~/.local/bin/

          curl -L https://github.com/pdfcpu/pdfcpu/releases/download/${PDFCPU_VERSION}/pdfcpu_${PDFCPU_VERSION#v}_Linux_x86_64.tar.xz | tar -xJ
          mv pdfcpu_${PDFCPU_VERSION#v}_Linux_x86_64/pdfcpu ~/.local/bin/
          chmod u+x ~/.local/bin/pdfcpu
          rm -r pdfcpu_${PDFCPU_VERSION#v}_Linux_x86_64

          pagefind_extended --version
          pdfcpu version
        env:
          PAGEFIND_VERSION: v1.5.2
          PDFCPU_VERSION: v0.15.0

      - run: just setup
      - name: Setup docit
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.docit.outputs.key }}
          path: target/typst-docs
          fail-on-cache-miss: true

      - run: just ci-build "/"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-cloudflare
          path: target/dist/

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-cloudflare
          path: target/dist/
      - name: Configure wrangler
        run: |
          cat >wrangler.jsonc <<'EOF'
          {
            "name": "docs-8138",
            "compatibility_date": "2026-09-21",
            "assets": {
              "directory": "./target/dist"
            },
            "previews": {},
          }
          EOF
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --name pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
