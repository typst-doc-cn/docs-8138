name: Cache typst-docs CLI
description: |
  Check the cache for typst-docs CLI, build it if necessary, and output the exact cache key.

on:
  workflow_call:
    inputs:
      ref:
        description: |
          The branch, tag or SHA in https://github.com/typst/typst.
          It does not need to match `TYPST_REF` in justfile exactly.
        default: 9f2b6e8715237cb086899a42873660fe744622e8
        type: string
    outputs:
      key:
        description: The exact cache key for the built typst-docs CLI.
        value: ${{ jobs.build.outputs.key }}

jobs:
  build:
    # This job should be moved into https://typst-community.github.io/dev-builds/ in the future.
    outputs:
      key: ${{ steps.key.outputs.key }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: typst/typst
          ref: ${{ inputs.ref }}
      - id: key
        run: echo "key=${{ runner.os }}-docit-${{ inputs.ref }}-${{ hashFiles('**/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: restore
        with:
          key: ${{ steps.key.outputs.key }}
          path: target/typst-docs

      - uses: dtolnay/rust-toolchain@stable
        if: steps.restore.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.restore.outputs.cache-hit != 'true'
      - name: Switch the profile and free the cwd
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          git apply --ignore-whitespace <<'EOF'
          diff --git a/.cargo/config.toml b/.cargo/config.toml
          index cb74b9d1d..0212beb8a 100644
          --- a/.cargo/config.toml
          +++ b/.cargo/config.toml
          @@ -8,7 +8,5 @@ testit = "run --quiet --package=test-wrapper --"

           # Runs the documentation generator.
           #
          -# We use the `dev-fast` profile as a reasonable trade-off between Rust and Typst
          -# compilation speed. Just `dev` makes the Typst compilation very slow, while
          -# `release` makes the Rust compilation very slow.
          -docit = "run --profile dev-fast --package=typst-docs --"
          +# We use the `release` profile to optimize the resulting binary.
          +docit = "run --profile release --package=typst-docs --"
          EOF
      - run: cargo docit --help
        if: steps.restore.outputs.cache-hit != 'true'
      - run: mv target/release/typst-docs target/typst-docs
        if: steps.restore.outputs.cache-hit != 'true'

      - run: target/typst-docs --help

      - uses: actions/cache/save@v6
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.key.outputs.key }}
          path: target/typst-docs
